<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IgnisGuard - Monitoramento de Incêndios</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border-color: #334155;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.5s ease;
        }

        body.alerta-ativo {
            animation: piscarAlerta 1s infinite alternate;
        }

        @keyframes piscarAlerta {
            0% { background-color: var(--bg-color); }
            100% { background-color: #450a0a; }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 { margin: 0; font-size: 1.8rem; }

        select {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-block;
        }

        .status-normal { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .status-perigo { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .card h3 { margin: 0 0 10px 0; color: var(--text-muted); font-size: 0.9rem; }
        .card .valor { font-size: 2rem; font-weight: bold; }

        #map {
            height: 350px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>IgnisGuard</h1>
            <span id="statusBadge" class="status-badge status-normal">SISTEMA NORMAL</span>
        </div>
        <div>
            <label for="seletorCidade">Selecionar Cidade: </label>
            <select id="seletorCidade" onchange="mudarCidade(this.value)">
                <option value="cachoeira_de_minas">Cachoeira de Minas</option>
                <option value="conceicao_dos_ouros">Conceição dos Ouros</option>
                <option value="santa_rita_do_sapucai">Santa Rita do Sapucaí</option>
            </select>
        </div>
    </header>

    <div class="cards-grid">
        <div class="card">
            <h3>TEMPERATURA</h3>
            <div id="tempVal" class="valor">-- °C</div>
        </div>
        <div class="card">
            <h3>UMIDADE</h3>
            <div id="umiVal" class="valor">-- %</div>
        </div>
        <div class="card">
            <h3>GÁS / FUMAÇA</h3>
            <div id="gasVal" class="valor">-- ppm</div>
        </div>
        <div class="card">
            <h3>SINAL LORA</h3>
            <div id="loraVal" class="valor">-- dBm</div>
        </div>
    </div>

    <div id="map"></div>
</div>

<script>
    // Configuração do Firebase
    const firebaseConfig = {
        databaseURL: "https://teste-79de3-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Configuração Inicial do Mapa Leaflet
    const map = L.map('map').setView([-22.3528, -45.7761], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let marker = L.marker([-22.3528, -45.7761]).addTo(map);

    let escutaAtual = null;

    function mudarCidade(cidadeKey) {
        if (escutaAtual) escutaAtual.off();

        escutaAtual = db.ref('cidades/' + cidadeKey);

        escutaAtual.on('value', (snapshot) => {
            const data = snapshot.val();
            
            if (data) {
                document.getElementById('tempVal').innerText = (data.temperatura !== undefined ? data.temperatura : '--') + ' °C';
                document.getElementById('umiVal').innerText = (data.umidade !== undefined ? data.umidade : '--') + ' %';
                document.getElementById('gasVal').innerText = (data.gas !== undefined ? data.gas : '--') + ' ppm';
                document.getElementById('loraVal').innerText = (data.lora !== undefined ? data.lora : '--') + ' dBm';

                const badge = document.getElementById('statusBadge');
                if (data.alerta) {
                    document.body.classList.add('alerta-ativo');
                    badge.innerText = '🚨 ALERTA DE INCÊNDIO';
                    badge.className = 'status-badge status-perigo';
                } else {
                    document.body.classList.remove('alerta-ativo');
                    badge.innerText = 'SISTEMA NORMAL';
                    badge.className = 'status-badge status-normal';
                }

                if (data.lat && data.lng) {
                    map.setView([data.lat, data.lng], 13);
                    marker.setLatLng([data.lat, data.lng]);
                }
            }
        });
    }

    // Inicia escutando a primeira cidade
    mudarCidade('cachoeira_de_minas');
</script>

</body>
</html>
